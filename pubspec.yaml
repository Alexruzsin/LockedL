name: lovelock_app
description: Páros zárolt képernyő rajzoló alkalmazás (Android & iOS) – Közös vászon, Saját fotó, Matricák és biztonságos 6 jegyű párosítás
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
