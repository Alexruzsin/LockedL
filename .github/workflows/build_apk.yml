name: Build LoveLock Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files and preserve custom code
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          cp android/app/src/main/kotlin/com/lovelock/app/MainActivity.kt /tmp/MainActivity.kt
          cp android/app/google-services.json /tmp/google-services.json

          flutter create . --project-name app --org com.lovelock --platforms android

          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          mkdir -p android/app/src/main/kotlin/com/lovelock/app
          cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/lovelock/app/MainActivity.kt
          cp /tmp/google-services.json android/app/google-services.json

          # Add SET_WALLPAPER and INTERNET permissions to AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.SET_WALLPAPER"\/><uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovelock-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
